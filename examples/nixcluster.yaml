# A whole cluster: nodeGroups select Machines by label, and each group's opaque
# `values` become that member's attrset in the generated node file. NIO renders
# one node file per selected Machine and owns a single converge NixCronJob.
#
# storeRef/builderRef are optional build acceleration. builderRef is what makes
# day-two converges fast — the member closures are realized on the builder and
# stay in its /nix, so give that NixBuilder `spec.storage` (see nixbuilder.yaml)
# and make sure it can build the members' systems: delegation sets max-jobs = 0,
# so there is no local fallback. storeRef adds the store as a substituter and
# supplies the SSH identity used to reach the builder.
apiVersion: nio.homystack.com/v1alpha1
kind: NixCluster
metadata:
  name: prod
  namespace: infra
spec:
  source:
    gitRepo: https://github.com/acme/prod-cluster
    ref: main
  # Cluster-wide SSH key: converge uses it to reach every member.
  sshKeyRef:
    name: cluster-ssh
  # sops age key, mounted into the converge pod so committed secrets decrypt.
  ageKeyRef:
    name: cluster-age
  storeRef:
    name: store
  builderRef:
    name: linux-builder
  dayTwoSchedule: "*/30 * * * *"
  nodeGroups:
    - name: control-plane
      selector:
        matchLabels:
          role: server
      # Optional: pick a stable, sticky subset of the matching Machines.
      count: 3
      values:
        k3s:
          role: server
    - name: workers
      selector:
        matchLabels:
          role: worker
      values:
        k3s:
          role: agent
