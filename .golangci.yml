version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # goconst >= 1.10 also counts strings inside composite literals. In
      # test files those are table fixtures (revisions, flake refs, names)
      # that read best inline next to the assertion, so they are skipped.
      # The option is a goconst setting rather than an exclusion rule
      # because occurrences are counted across the whole package.
      ignore-tests: true
    misspell:
      # Nix domain terms that misspell wrongly flags as English typos.
      ignore-rules:
        - substituters
        - substituter
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
