                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dayTwoCronJobRef:
                description: DayTwoCronJobRef is the name of the child day-2 NixCronJob.
                type: string
              decommissionJobRef:
                description: DecommissionJobRef is the name of the orphan decommission
                  NixJob.
                type: string
              fullDiskInstallCompleted:
                description: FullDiskInstallCompleted indicates if nixos-anywhere
                  was run.
                type: boolean
              installJobRef:
                description: InstallJobRef is the name of the child install NixJob
                  (nixos-anywhere).
                type: string
              installRetries:
                description: InstallRetries bounds Installing retry.
                format: int32
                type: integer
              lastAppliedTime:
                description: LastAppliedTime is the timestamp of last successful application.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              onRemoveRetries:
                description: OnRemoveRetries bounds decommission retry.
                format: int32
                type: integer
              phase:
                description: |-
                  Phase is the coarse orchestrator state machine state
                  (Pending, Blocked, Installing, Converging, Ready, Degraded, Removing).
                type: string
              resolvedRevision:
                description: |-
                  ResolvedRevision is the immutable commit SHA currently rolled out, sourced
                  from the day-2 child's status.rolledOutRevision.
                type: string
              targetMachine:
                description: TargetMachine is the Machine resource name this config
                  applies to.
                type: string
            type: object
