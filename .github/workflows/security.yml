name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory is noticed without waiting for a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        # Full history: a secret that only ever existed in an earlier commit is
        # still published, so scanning the tip alone would miss it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    # Reports, does not gate — for now, and visibly rather than through an ignore
    # file. Its first run found 10 advisories reachable from our own code. The
    # module half is a straight bump; the standard-library half needs a newer
    # toolchain, which the pinned golangci-lint refuses, and bumping that linter
    # surfaces 51 findings from linters this project already enables. That chain is
    # queued as its own change — see G1-G3 in .agent-e2e/PROBLEMS.md. Flip this to
    # blocking once it lands.
    continue-on-error: true
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
