name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Assemble and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The release must be installable from its own artifacts, so install.yaml is
      # built with the released image pinned — not with the Makefile's dev default.
      - name: Build install.yaml with the released image pinned
        run: |
          make build-installer IMG=ghcr.io/${{ github.repository_owner }}/nio:${{ github.ref_name }}
          mkdir -p dist
          cat config/crd/bases/*.yaml > dist/crds.yaml

      - name: Assemble release notes
        run: |
          {
            cat docs/release-notes/${{ github.ref_name }}.md 2>/dev/null || true
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "kubectl apply --server-side --filename https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.yaml"
            echo '```'
            echo
            echo '`--server-side` is required, not a preference: these CRD schemas are'
            echo 'larger than the 256 KB limit on the annotation client-side apply writes,'
            echo 'so a plain `kubectl apply` fails with "metadata.annotations: Too long".'
          } > dist/notes.md

      # A release whose install.yaml pins an image tag that does not exist is not a
      # release. Fail here rather than let someone discover it with kubectl.
      - name: Verify install.yaml pins an image that exists
        run: |
          set -euo pipefail
          image="$(grep --only-matching --extended-regexp 'ghcr\.io/[^[:space:]]+' dist/install.yaml | sort --unique)"
          echo "install.yaml pins: $image"
          test "$(printf '%s\n' "$image" | wc -l)" -eq 1
          docker buildx imagetools inspect "$image" > /tmp/manifest.txt
          cat /tmp/manifest.txt
          grep --quiet 'linux/amd64' /tmp/manifest.txt
          grep --quiet 'linux/arm64' /tmp/manifest.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file dist/notes.md \
            --generate-notes \
            dist/install.yaml dist/crds.yaml
